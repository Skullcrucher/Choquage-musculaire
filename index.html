<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>Skullcrusher</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skullcrusher">
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/papaparse.min.js"></script>
<script src="js/vendor/chart.umd.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">
    <img class="topbar-logo" src="icons/logo.png" alt="" aria-hidden="true">
    <div class="topbar-title" id="topbar-title">Skullcrusher</div>
  </div>
  <div class="topbar-status" id="sync-status" title="État de synchronisation"></div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab-btn" data-tab="seance">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 12H2M22 12h-2M6 8v8M18 8v8M6 10H4v4h2M18 10h2v4h-2M9 6v12M15 6v12M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="tab-label">Séance</span>
  </button>
  <button class="tab-btn" data-tab="historique">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="5" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="2"/>
      <path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="8" cy="14.5" r="1.2" fill="currentColor"/>
      <circle cx="12" cy="14.5" r="1.2" fill="currentColor"/>
      <circle cx="8" cy="18" r="1.2" fill="currentColor"/>
    </svg>
    <span class="tab-label">Historique</span>
  </button>
  <button class="tab-btn featured" data-tab="feed">
    <span class="tab-icon-badge">
      <svg class="tab-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g fill="currentColor">
          <rect x="30" y="50" width="38" height="38" rx="17"/>
          <rect x="37" y="42" width="12" height="18" rx="6"/>
          <rect x="50" y="42" width="12" height="18" rx="6"/>
          <rect x="-6.5" y="-44" width="13" height="44" rx="6.5" transform="translate(36 52) rotate(-16)"/>
          <rect x="-5.5" y="-40" width="11" height="40" rx="5.5" transform="translate(63 54) rotate(18)"/>
          <rect x="-6.5" y="-32" width="13" height="32" rx="6.5" transform="translate(32 68) rotate(-82)"/>
        </g>
      </svg>
    </span>
    <span class="tab-label">Feed</span>
  </button>
  <button class="tab-btn" data-tab="stats">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 20V10M12 20V4M20 20v-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="tab-label">Stats</span>
  </button>
  <button class="tab-btn" data-tab="reglages">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1.09-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.36.36.84.6 1.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="tab-label">Réglages</span>
  </button>
</nav>

<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
