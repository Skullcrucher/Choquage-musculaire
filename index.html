    function fit() {
      var portrait = !window.matchMedia || matchMedia("(orientation: portrait)").matches;
      var h = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      document.documentElement.style.setProperty("--app-h", Math.max(h, window.innerHeight) + "px");
    }
    fit();
    window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
    window.addEventListener("resize", fit);
  })();
</script>
