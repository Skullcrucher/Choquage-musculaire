<!-- Filet de sécurité au démarrage : si l'app n'a rien affiché au bout de
     quelques secondes (fichier introuvable, erreur JavaScript, ancienne
     version en cache...), on affiche l'erreur et un bouton de réparation
     au lieu d'un écran noir. Script classique : il tourne même si les
     modules de l'app échouent. -->
<script>
(function () {
  var errors = [];
  function note(msg) { if (msg && errors.length < 5) errors.push(String(msg).slice(0, 300)); }
  // Fichiers de versions différentes (cache du navigateur ou du CDN après

  function autoRepair(msg) {

    try { if (sessionStorage.getItem("skullcrusher_autorepair")) return; sessionStorage.setItem("skullcrusher_autorepair", "1"); } catch (_) { return; }
    repair();
  }
  window.addEventListener("error", function (e) {
    if (e.target && e.target !== window && e.target.src) note("Chargement impossible : " + e.target.src);
    else { note(e.message + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "")); autoRepair(e.message); }
  }, true);
  window.addEventListener("unhandledrejection", function (e) { var m = e.reason && (e.reason.message || e.reason); note(m); autoRepair(m); });
  window.__skullBootError = note;

  function repair() {
    // Rechargement avec une adresse neuve : contourne aussi le cache HTTP
    // de la page elle-même.
    var done = function () { location.replace(location.pathname + "?refresh=" + Date.now()); };
    try {
      var tasks = [];

      if (window.caches) tasks.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(tasks).then(done, done);
    } catch (_) { done(); }
  }

  // Textes de cet écran de secours (le module de traduction peut ne pas
  // s'être chargé) : petit dictionnaire autonome.
  var L = { fr: 0, en: 1, mfe: 2, pl: 3 }[(function () { try { return localStorage.getItem("skullcrusher_lang"); } catch (_) { return null; } })() || "fr"] || 0;
  var T = {
    fail: ["L'app n'a pas pu démarrer.", "The app could not start.", "Aplikasion-la pa finn kapav demare.", "Nie udało się uruchomić aplikacji."],
    help: ["Vérifie ta connexion, puis appuie sur « Réparer » : ça vide le cache de l'app et la recharge (tes séances ne sont pas touchées).",
           "Check your connection, then tap “Repair”: it clears the app cache and reloads it (your workouts are not affected).",
           "Verifie to koneksion, apre pes « Repar » : sa vid kas aplikasion-la ek relans li (to bann sesion pa touse).",
           "Sprawdź połączenie, a potem naciśnij „Napraw”: wyczyści to pamięć podręczną aplikacji i ją przeładuje (twoje treningi pozostaną nietknięte)."],
    repair: ["Réparer", "Repair", "Repar", "Napraw"],
    retry: ["Réessayer", "Try again", "Esey ankor", "Spróbuj ponownie"],
    detail: ["Détail technique (à transmettre si ça persiste) :", "Technical details (send them if the problem persists):", "Detay teknik (avoy sa si problem-la kontinie) :", "Szczegóły techniczne (prześlij je, jeśli problem się powtarza):"],
    none: ["aucune erreur signalée — le démarrage est bloqué (connexion à Firebase ?)", "no error reported — startup is stuck (Firebase connection?)", "okenn erer pa finn signale — demaraz-la bloke (koneksion Firebase ?)", "brak zgłoszonych błędów — uruchamianie się zawiesiło (połączenie z Firebase?)"]
  };
  function tr(k) { return T[k][L]; }

  setTimeout(function () {
    var view = document.getElementById("view");
    if (!view || view.textContent.trim() || view.children.length) return; // l'app a démarré
    var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
    view.innerHTML =
      '<div class="empty-state" style="text-align:left;">' +
      '<p style="font-size:17px;color:var(--text);">' + esc(tr("fail")) + '</p>' +
      '<p class="muted">' + esc(tr("help")) + '</p>' +
      '<button class="btn btn-primary" id="boot-repair" style="margin:10px 0;">' + esc(tr("repair")) + '</button>' +
      '<button class="btn btn-secondary" id="boot-retry">' + esc(tr("retry")) + '</button>' +
      '<p class="muted" style="font-size:12px;margin-top:16px;">' + esc(tr("detail")) + '<br>' +
      (errors.length ? errors.map(esc).join("<br>") : esc(tr("none"))) +
      '<br>' + esc(navigator.userAgent) + '</p></div>';

  }, 12000);

</script>
